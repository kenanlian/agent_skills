<!doctype html>
<!-- Card template for recorded videos: scripts/rec-cards.mjs fills the {{tokens}} per card. -->
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <title>{{TITLE}}</title>
    <link rel="stylesheet" href="assets/fonts.css" />
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
      #root {
        --accent-h: {{ACCENT_H}};
        --accent-s: {{ACCENT_S}}%;
        --accent-l: {{ACCENT_L}}%;
        --accent: hsl(var(--accent-h), var(--accent-s), var(--accent-l));
        --text-normal: hsl(var(--accent-h), 6%, 12%);
        --text-muted: hsl(var(--accent-h), 9%, 36%);
        --ink-shadow: 40 44 70;
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #f3f4f8;
      }
      /* Laid out at 1920 x 1080; zoom keeps text and SVG crisp at the clips' size. */
      #frame {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
        zoom: {{ZOOM}};
        font-family: {{FONT}};
        color: var(--text-normal);
      }
      .blob {
        position: absolute;
        width: 900px;
        height: 900px;
        border-radius: 50%;
        background: radial-gradient(circle, hsla(var(--accent-h), var(--accent-s), var(--accent-l), 0.2), transparent 62%);
      }
      .blob-a {
        left: -360px;
        top: -420px;
      }
      .blob-b {
        right: -380px;
        bottom: -460px;
        opacity: 0.7;
      }
      section {
        position: absolute;
        inset: 0;
        display: none;
      }
      section.active {
        display: block;
      }

      .brand-card.active {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      .brand-logo svg {
        display: block;
        width: 150px;
        height: 150px;
        filter: drop-shadow(0 16px 32px rgb(34 55 78 / 0.28));
      }
      .brand-wordmark {
        margin-top: 40px;
        color: #1f2a37;
      }
      .brand-wordmark svg {
        display: block;
        width: 560px;
        overflow: visible;
      }
      .brand-tagline {
        margin-top: 30px;
        font-size: 40px;
        font-weight: 500;
        letter-spacing: 0.04em;
        color: var(--text-normal);
      }
      .brand-sub {
        margin-top: 16px;
        font-size: 26px;
        letter-spacing: 0.12em;
        color: var(--text-muted);
      }
      #outro .brand-tagline {
        margin-top: 26px;
        font-size: 32px;
        font-weight: 400;
        letter-spacing: 0.06em;
        color: var(--text-muted);
      }

      .chapter-head {
        position: absolute;
        left: 160px;
        top: 96px;
        display: flex;
        align-items: center;
        gap: 18px;
      }
      .mini-logo svg {
        display: block;
        width: 52px;
        height: 52px;
        filter: drop-shadow(0 6px 14px rgb(34 55 78 / 0.22));
      }
      .kicker {
        font-size: 22px;
        letter-spacing: 0.18em;
        color: var(--accent);
      }
      .chapter-body {
        position: absolute;
        left: 160px;
        top: 300px;
        width: 1020px;
      }
      .part {
        display: flex;
        align-items: baseline;
        gap: 14px;
        color: var(--accent);
      }
      .part-no {
        font-size: 120px;
        font-weight: 300;
        line-height: 1;
        letter-spacing: 0.02em;
      }
      .part-total {
        font-size: 34px;
        color: var(--text-muted);
        letter-spacing: 0.08em;
      }
      .chapter-title {
        margin: 34px 0 0;
        font-size: 76px;
        font-weight: 500;
        line-height: 1.2;
      }
      .chapter-summary {
        margin: 26px 0 0;
        font-size: 36px;
        line-height: 1.55;
        color: var(--text-muted);
      }
      .progress {
        display: flex;
        gap: 12px;
        margin-top: 58px;
      }
      .seg {
        position: relative;
        width: 76px;
        height: 8px;
        border-radius: 4px;
        overflow: hidden;
        background: rgb(var(--ink-shadow) / 0.12);
      }
      .seg.done {
        background: hsla(var(--accent-h), var(--accent-s), var(--accent-l), 0.45);
      }
      .seg.current {
        background: hsla(var(--accent-h), var(--accent-s), var(--accent-l), 0.18);
      }
      .seg-fill {
        position: absolute;
        inset: 0;
        border-radius: 4px;
        background: var(--accent);
        transform-origin: 0 50%;
        transform: scaleX(0);
      }

      /* The logo's bar and two cards, enlarged into a flat illustration. */
      .deco {
        position: absolute;
        left: 1250px;
        top: 290px;
        width: 520px;
        height: 520px;
      }
      .deco-tile {
        position: absolute;
        inset: 0;
        border-radius: 120px;
        background: hsla(var(--accent-h), var(--accent-s), var(--accent-l), 0.1);
        overflow: hidden;
      }
      .deco-bar {
        position: absolute;
        left: 98px;
        top: 114px;
        width: 32px;
        height: 292px;
        border-radius: 16px;
        background: hsla(var(--accent-h), var(--accent-s), var(--accent-l), 0.45);
      }
      .deco-card {
        position: absolute;
        width: 210px;
        height: 146px;
        border-radius: 34px;
        background: #fff;
        box-shadow: 0 18px 40px rgb(var(--ink-shadow) / 0.14), 0 2px 6px rgb(var(--ink-shadow) / 0.08);
      }
      .deco-card::before,
      .deco-card::after {
        content: "";
        position: absolute;
        left: 30px;
        height: 14px;
        border-radius: 7px;
        background: rgb(var(--ink-shadow) / 0.1);
      }
      .deco-card::before {
        top: 40px;
        width: 110px;
        background: hsla(var(--accent-h), var(--accent-s), var(--accent-l), 0.55);
      }
      .deco-card::after {
        top: 78px;
        width: 150px;
      }
      .deco-top {
        left: 162px;
        top: 98px;
      }
      .deco-bottom {
        left: 210px;
        top: 276px;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="card" data-start="0" data-width="{{WIDTH}}" data-height="{{HEIGHT}}" data-fps="{{FPS}}" data-duration="{{DURATION}}">
      <div id="frame">
        <div class="blob blob-a"></div>
        <div class="blob blob-b"></div>

        <section class="brand-card" id="intro">
          <div class="brand-logo"></div>
          <div class="brand-wordmark"></div>
          <div class="brand-tagline"></div>
          <div class="brand-sub"></div>
        </section>

        <section id="chapter">
          <header class="chapter-head">
            <div class="mini-logo"></div>
            <span class="kicker"></span>
          </header>
          <div class="chapter-body">
            <div class="part"><span class="part-no"></span><span class="part-total"></span></div>
            <h1 class="chapter-title"></h1>
            <p class="chapter-summary"></p>
            <div class="progress"></div>
          </div>
          <div class="deco">
            <div class="deco-tile">
              <div class="deco-bar"></div>
              <div class="deco-card deco-top"></div>
              <div class="deco-card deco-bottom"></div>
            </div>
          </div>
        </section>

        <section class="brand-card" id="outro">
          <div class="brand-logo"></div>
          <div class="brand-wordmark"></div>
          <div class="brand-tagline"></div>
        </section>
      </div>
    </div>
    <script>
      window.__CARD = {{DATA}};
    </script>
    <script src="assets/app.js"></script>
  </body>
</html>
